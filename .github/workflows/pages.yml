name: Deploy Pet Coin Breaker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Rebuild game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat game/part*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/pet-coin-breaker.html.gz
          gzip -dc /tmp/pet-coin-breaker.html.gz > public/index.html
          cp manifest.json public/manifest.json
          touch public/.nojekyll
          test -s public/index.html
          echo "Base game rebuilt: $(wc -c < public/index.html) bytes"

      - name: Apply Version 2 admin patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/index.html")
          html = page.read_text(encoding="utf-8")
          css = Path("patches/v2.css").read_text(encoding="utf-8")
          panel = Path("patches/v2.html").read_text(encoding="utf-8")
          js = Path("patches/v2.js").read_text(encoding="utf-8")
          html = html.replace("</style>", css + "\n</style>", 1)
          html = html.replace('<div class="burst" id="burst"></div>', '<div class="burst" id="burst"></div>\n' + panel, 1)
          html = html.replace("</body>", "<script>\n" + js + "\n</script>\n</body>", 1)
          page.write_text(html, encoding="utf-8")
          PY

      - name: Apply Version 3 Huge rarity and biome pets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/index.html")
          html = page.read_text(encoding="utf-8")
          css = Path("patches/v3.css").read_text(encoding="utf-8")
          js = Path("patches/v3.js").read_text(encoding="utf-8")
          html = html.replace("</style>", css + "\n</style>", 1)
          html = html.replace("</body>", "<script>\n" + js + "\n</script>\n</body>", 1)
          page.write_text(html, encoding="utf-8")
          PY

      - name: Apply Version 4 Huge 5x visuals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/index.html")
          html = page.read_text(encoding="utf-8")
          css = Path("patches/v4.css").read_text(encoding="utf-8")
          html = html.replace("</style>", css + "\n</style>", 1)
          page.write_text(html, encoding="utf-8")
          PY

      - name: Apply Version 5 tougher coins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/index.html")
          html = page.read_text(encoding="utf-8")
          js = Path("patches/v5.js").read_text(encoding="utf-8")
          html = html.replace("</body>", "<script>\n" + js + "\n</script>\n</body>", 1)
          page.write_text(html, encoding="utf-8")
          PY

      - name: Apply Version 6 Rainbow nerf
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/index.html")
          html = page.read_text(encoding="utf-8")
          js = Path("patches/v6.js").read_text(encoding="utf-8")
          html = html.replace("</body>", "<script>\n" + js + "\n</script>\n</body>", 1)
          page.write_text(html, encoding="utf-8")
          Path("public/pages-version.json").write_text('{"version":6,"patch":"rainbow-nerf-x7"}', encoding="utf-8")
          print("Version 6 patch applied:", page.stat().st_size, "bytes")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
