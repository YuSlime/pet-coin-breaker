name: Deploy Pet Coin Breaker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Rebuild game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cat game/part*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/pet-coin-breaker.html.gz
          gzip -dc /tmp/pet-coin-breaker.html.gz > public/index.html
          cp manifest.json public/manifest.json
          touch public/.nojekyll
          test -s public/index.html
          echo "Game rebuilt: $(wc -c < public/index.html) bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
