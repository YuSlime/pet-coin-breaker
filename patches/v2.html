<button class="admin-fab" id="adminToggle" type="button">ADMIN</button>
<div class="admin-panel" id="adminPanel" aria-label="開発者用アドミンパネル">
<div class="admin-head"><div><div class="admin-title">🛠 DEV ADMIN</div><div class="admin-sub">アップデート検証用 / F2でも開閉</div></div><button class="admin-btn" id="adminClose" type="button">✕</button></div>
<div class="admin-group"><div class="admin-label">🪙 コイン</div><div class="admin-row"><button class="admin-btn" onclick="adminCoins(10000)">+10K</button><button class="admin-btn" onclick="adminCoins(1000000)">+1M</button><button class="admin-btn gold" onclick="adminCoins(1000000000)">+1B</button><button class="admin-btn red" onclick="adminSetCoins(0)">0にする</button></div></div>
<div class="admin-group"><div class="admin-label">🌍 エリア / 戦闘</div><div class="admin-row"><select class="admin-select" id="adminZone"><option value="0">草原</option><option value="1">砂漠</option><option value="2">氷</option><option value="3">火山</option></select><button class="admin-btn green" onclick="adminSetZone()">移動</button><button class="admin-btn" onclick="adminFullHp()">HP全回復</button><button class="admin-btn red" onclick="adminBreakTarget()">即破壊</button></div></div>
<div class="admin-group"><div class="admin-label">🍀 Luck / 開封</div><div class="admin-row"><button class="admin-btn" onclick="adminLuck(0,0)">Luck 0</button><button class="admin-btn" onclick="adminLuck(5,5)">両方5</button><button class="admin-btn gold" onclick="adminLuck(10,10)">両方MAX</button><button class="admin-btn" onclick="adminHatchAmount(1)">1連</button><button class="admin-btn" onclick="adminHatchAmount(5)">5連</button></div></div>
<div class="admin-group"><div class="admin-label">🐾 テストペット生成</div><div class="admin-row"><select class="admin-select" id="adminPetZone"><option value="0">草原の卵</option><option value="1">砂漠の卵</option><option value="2">氷の卵</option><option value="3">火山の卵</option></select><select class="admin-select" id="adminRarity"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Epic</option><option selected>Legendary</option></select><select class="admin-select" id="adminMutation"><option>Normal</option><option>Gold</option><option>Diamond</option><option>Rainbow</option></select></div><label class="admin-check"><input type="checkbox" id="adminHuge"> 👑 Hugeとして生成</label><div class="admin-row"><button class="admin-btn green" onclick="adminAddPet()">＋ ペット追加</button><button class="admin-btn gold" onclick="adminQuickHuge()">👑 Rainbow Huge追加</button><button class="admin-btn" onclick="adminEquipBest()">最強を装備</button></div></div>
<div class="admin-group"><div class="admin-label">⚙️ プレイヤー設定</div><div class="admin-row"><button class="admin-btn" onclick="adminEquipSlots(3)">装備3</button><button class="admin-btn" onclick="adminEquipSlots(6)">装備6</button><button class="admin-btn" onclick="adminClickPower(1000)">タップ1000</button><button class="admin-btn" onclick="adminCoinBonus(10)">コイン×10</button></div></div>
<div class="admin-group"><div class="admin-label">💾 セーブ / 初期化</div><div class="admin-row"><button class="admin-btn green" onclick="adminSave()">保存</button><button class="admin-btn" onclick="adminReload()">再読込</button><button class="admin-btn red" onclick="adminResetGame()">ゲーム初期化</button></div><div class="admin-state" id="adminState">状態を読み込み中...</div></div>
</div>
